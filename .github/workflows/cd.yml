name: Android CD (Release)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release Tag Name (e.g. v0.1.0-rc or v1.0.0)'
        required: true
        default: 'v0.1.0-rc'

jobs:
  release:
    name: Build & Publish Release (APK & AAB)
    runs-on: ubuntu-latest
    environment: ANDROID_ENV
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Metadata
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.version_name }}"
          else
            TAG_NAME="${{ github.ref_name }}"
          fi

          APP_VERSION="${TAG_NAME#v}"
          VERSION_CODE=$(git rev-list --count HEAD)

          if echo "$TAG_NAME" | grep -qiE '-(rc|alpha|beta)'; then
            IS_PRERELEASE="true"
          else
            IS_PRERELEASE="false"
          fi

          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

          echo "Release Tag: $TAG_NAME"
          echo "App versionName: $APP_VERSION (versionCode: $VERSION_CODE)"
          echo "Pre-release: $IS_PRERELEASE"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release Bundle (AAB) & APKs
        run: |
          ./gradlew bundleRelease assembleRelease assembleDebug \
            -PappVersionName="${{ steps.meta.outputs.version }}" \
            -PappVersionCode="${{ steps.meta.outputs.version_code }}"

      - name: Generate Keystore & Sign Release Artifacts
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_APP_SECRET }}
        run: |
          # Use provided secret or fallback to default secure key for local runs
          PASS="${KEYSTORE_PASSWORD:-rare_launcher_secret_2026}"

          # Generate signing keystore valid for 10 years (3650 days)
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias rarelauncer \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=Team Zombie, OU=Team Zombie, O=The Five Zombie Org, L=Jakarta, ST=DKI Jakarta, C=ID"

          # Locate Android build-tools apksigner and zipalign
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          TAG_NAME="${{ steps.meta.outputs.tag }}"
          mkdir -p release_assets

          # 1. Sign Release AAB (Android App Bundle for Google Play)
          AAB_UNSIGNED="app/build/outputs/bundle/release/app-release.aab"
          AAB_SIGNED="release_assets/RareLauncer-${TAG_NAME}.aab"
          if [ -f "$AAB_UNSIGNED" ]; then
            cp "$AAB_UNSIGNED" "$AAB_SIGNED"
            jarsigner -keystore release.keystore \
              -storepass "$PASS" \
              -keypass "$PASS" \
              "$AAB_SIGNED" rarelauncer
            echo "Successfully signed AAB: $AAB_SIGNED"
          fi

          # 2. Align & Sign Release APK (Standalone Signed APK)
          APK_UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          APK_ALIGNED="app-release-aligned.apk"
          APK_SIGNED="release_assets/RareLauncer-${TAG_NAME}-release.apk"
          if [ -f "$APK_UNSIGNED" ]; then
            $BUILD_TOOLS_DIR/zipalign -P 16 -f 4 "$APK_UNSIGNED" "$APK_ALIGNED"
            $BUILD_TOOLS_DIR/apksigner sign \
              --ks release.keystore \
              --ks-pass pass:"$PASS" \
              --ks-key-alias rarelauncer \
              --key-pass pass:"$PASS" \
              --out "$APK_SIGNED" \
              "$APK_ALIGNED"
            echo "Successfully signed APK: $APK_SIGNED"
          fi

          # 3. Copy Debug APK (for quick testing/sideloading)
          APK_DEBUG="app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$APK_DEBUG" ]; then
            cp "$APK_DEBUG" "release_assets/RareLauncer-${TAG_NAME}-debug.apk"
          fi

          # 4. Generate SHA-256 Checksums for security verification
          cd release_assets
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Create GitHub Release with Artifacts List
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Rare Launcer ${{ steps.meta.outputs.tag }}
          files: |
            release_assets/*.aab
            release_assets/*.apk
            release_assets/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          body: |
            ### 🌌 Rare Launcer `${{ steps.meta.outputs.tag }}`

            Build artifacts for **The Five Zombie Org** (Team Zombie) — `versionName: ${{ steps.meta.outputs.version }}` (`versionCode: ${{ steps.meta.outputs.version_code }}`).

            | Asset | Deskripsi |
            |---|---|
            | 📦 **`.aab`** | Google Play Store Distribution (Android App Bundle, Signed) |
            | 📱 **`-release.apk`** | Production Release APK (Signed with 10-Year Keystore) |
            | 🧪 **`-debug.apk`** | Development & Testing APK (Direct ADB Install) |
            | 🔐 **`SHA256SUMS.txt`** | Checksum verifikasi integritas file |

            > **Signing Identity**: `O=The Five Zombie Org`, `CN/OU=Team Zombie`, Validity: 10 Years (3650 days).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
